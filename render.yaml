services:
  # ---------------------------------------------------
  # Laravel Backend (Native PHP Environment)
  # ---------------------------------------------------
  - type: web
    name: expense-tracker-api
    runtime: php
    root: expense-tracker-api
    plan: free
    region: ohio # or your preferred region

    # Build Command: Install PHP deps and migrate DB
    buildCommand: composer install --no-dev --optimize-autoloader && php artisan migrate --force

    # Start Command: Using built-in server for simplicity on Render Native
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT

    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://expense-tracker-api.onrender.com

      # Frontend Connection (CORS & Sanctum)
      - key: FRONTEND_URL
        value: https://expense-tracker-frontend-iyhk.onrender.com
      - key: SANCTUM_STATEFUL_DOMAINS
        value: expense-tracker-frontend-iyhk.onrender.com,daliii.me

      # Database Connection (Auto-linked)
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: expense-tracker-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: expense-tracker-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: expense-tracker-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: expense-tracker-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: expense-tracker-db
          property: password
      - key: DB_SSL_MODE
        value: require

      # Secrets (Set manually in Dashboard for security)
      - key: STRIPE_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  # ---------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------
  - name: expense-tracker-db
    databaseName: expense_tracker
    user: expense_user
    plan: free # Expire after 90 days on free tier
