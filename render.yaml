services:
  # ---------------------------------------------------
  # Laravel Backend (Dockerized PHP 8.3 Environment)
  # ---------------------------------------------------
  - type: web
    name: expense-tracker-api
    runtime: docker
    rootDir: expense-tracker-api
    plan: free
    region: ohio

    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://expense-tracker-api.onrender.com

      # Frontend Connection (CORS & Sanctum)
      - key: FRONTEND_URL
        value: https://expense-tracker-frontend-iyhk.onrender.com
      - key: SANCTUM_STATEFUL_DOMAINS
        value: expense-tracker-frontend-iyhk.onrender.com

      # Database Connection (Auto-linked)
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: expense-tracker-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: expense-tracker-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: expense-tracker-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: expense-tracker-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: expense-tracker-db
          property: password
      - key: DB_SSL_MODE
        value: require

      # Secrets (Set in Render Dashboard)
      - key: STRIPE_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # AI Advisor Configuration (Free Tier Google Gemini / Groq)
      - key: AI_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b

databases:
  # ---------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------
  - name: expense-tracker-db
    databaseName: expense_tracker
    user: expense_user
    plan: free
    region: ohio
