<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Modern vibrant gradient background -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="100" height="100" rx="24" fill="url(#bg-grad)" />
  
  <!-- Thick, highly visible white dollar sign / chart symbol -->
  <g filter="url(#shadow)" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="50" y1="20" x2="50" y2="80" />
    <path d="M 65 35 C 65 22, 35 22, 35 40 C 35 55, 65 55, 65 70 C 65 88, 35 88, 35 75" />
  </g>
</svg>
